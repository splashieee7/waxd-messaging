name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build release
    runs-on: ubuntu-latest
    # Signing: add these four repository secrets and every build on main is a
    # signed, installable APK. Without them the build still runs but the APK
    # is unsigned.
    #   SIGNING_STORE_BASE64   base64 of keystore.jks
    #   SIGNING_STORE_PASSWORD
    #   SIGNING_KEY_ALIAS
    #   SIGNING_KEY_PASSWORD
    env:
      SIGNING_STORE_BASE64: ${{ secrets.SIGNING_STORE_BASE64 }}
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing keystore
        if: env.SIGNING_STORE_BASE64 != ''
        run: |
          echo "$SIGNING_STORE_BASE64" | base64 -d > keystore.jks
          cat > keystore.properties <<EOF
          storePassword=$SIGNING_STORE_PASSWORD
          keyPassword=$SIGNING_KEY_PASSWORD
          keyAlias=$SIGNING_KEY_ALIAS
          storeFile=keystore.jks
          EOF

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Rename artifact
        id: apk
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          VERSION=$(grep -oP '(?<=versionName = ")[^"]+' app/build.gradle.kts | head -n1)
          OUT="waxd-messaging-${VERSION}.apk"
          cp "$APK" "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: waxd-messaging-apk
          path: ${{ steps.apk.outputs.path }}

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
